<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e0e14" />
      <stop offset="100%" stop-color="#07070a" />
    </linearGradient>
    <linearGradient id="redAccent1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e50914" />
      <stop offset="100%" stop-color="#b91c1c" />
    </linearGradient>
    <linearGradient id="fluidA" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ff4455" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#990011" stop-opacity="0.9" />
    </linearGradient>
    <linearGradient id="fluidB" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0369a1" stop-opacity="0.9" />
    </linearGradient>
    <linearGradient id="fluidMix" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#6b21a8" stop-opacity="0.9" />
    </linearGradient>
    <pattern id="grid1" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="1" />
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="600" height="380" rx="12" fill="url(#bgGrad1)" />
  <rect width="600" height="380" fill="url(#grid1)" rx="12" />

  <!-- Industrial Header Banner -->
  <rect x="25" y="20" width="550" height="35" rx="6" fill="#15151e" stroke="#252532" stroke-width="1" />
  <circle cx="45" cy="37" r="5" fill="#e50914" />
  <circle cx="62" cy="37" r="5" fill="#f59e0b" />
  <circle cx="79" cy="37" r="5" fill="#10b981" />
  <text x="105" y="42" font-family="'JetBrains Mono', monospace" font-size="12" fill="#a1a1aa" letter-spacing="1">OMRON PLC • CX-PROGRAMMER SCADA</text>
  <rect x="460" y="27" width="100" height="20" rx="4" fill="rgba(229,9,20,0.15)" stroke="#e50914" stroke-width="1" />
  <text x="475" y="41" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="bold" fill="#ff4d4d">RUNNING: AUTO</text>

  <!-- Tank A -->
  <g transform="translate(60, 80)">
    <rect x="0" y="0" width="100" height="110" rx="8" fill="#181824" stroke="#2e2e42" stroke-width="2" />
    <rect x="6" y="30" width="88" height="74" rx="4" fill="url(#fluidA)" />
    <!-- Level lines -->
    <line x1="8" y1="45" x2="25" y2="45" stroke="#ffffff" stroke-width="1" stroke-dasharray="2 2" opacity="0.6" />
    <line x1="8" y1="75" x2="25" y2="75" stroke="#ffffff" stroke-width="1" stroke-dasharray="2 2" opacity="0.6" />
    <text x="50" y="20" font-family="'Outfit', sans-serif" font-size="11" font-weight="bold" fill="#f43f5e" text-anchor="middle">SOLVENT A</text>
    <text x="50" y="80" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">75% LVL</text>
    <!-- Solenoid Valve A -->
    <path d="M 40 110 L 60 110 L 50 125 Z" fill="#e50914" />
    <path d="M 40 140 L 60 140 L 50 125 Z" fill="#e50914" />
    <rect x="46" y="118" width="8" height="14" fill="#ffffff" />
    <!-- Pipe to mixer -->
    <path d="M 50 140 L 50 170 L 190 170 L 190 195" fill="none" stroke="#ff4455" stroke-width="4" stroke-linecap="round" />
  </g>

  <!-- Tank B -->
  <g transform="translate(440, 80)">
    <rect x="0" y="0" width="100" height="110" rx="8" fill="#181824" stroke="#2e2e42" stroke-width="2" />
    <rect x="6" y="45" width="88" height="59" rx="4" fill="url(#fluidB)" />
    <line x1="75" y1="60" x2="92" y2="60" stroke="#ffffff" stroke-width="1" stroke-dasharray="2 2" opacity="0.6" />
    <text x="50" y="20" font-family="'Outfit', sans-serif" font-size="11" font-weight="bold" fill="#38bdf8" text-anchor="middle">POLYMER B</text>
    <text x="50" y="80" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">55% LVL</text>
    <!-- Solenoid Valve B -->
    <path d="M 40 110 L 60 110 L 50 125 Z" fill="#0284c7" />
    <path d="M 40 140 L 60 140 L 50 125 Z" fill="#0284c7" />
    <rect x="46" y="118" width="8" height="14" fill="#ffffff" />
    <!-- Pipe to mixer -->
    <path d="M 50 140 L 50 170 L -90 170 L -90 195" fill="none" stroke="#38bdf8" stroke-width="4" stroke-linecap="round" />
  </g>

  <!-- Central Mixing Tank -->
  <g transform="translate(220, 175)">
    <!-- Tank Chamber -->
    <rect x="0" y="20" width="160" height="130" rx="14" fill="#13131d" stroke="#e50914" stroke-width="2" />
    <!-- Mixed Fluid -->
    <rect x="8" y="65" width="144" height="80" rx="8" fill="url(#fluidMix)" />
    <!-- Motor / Agitator on Top -->
    <rect x="62" y="0" width="36" height="24" rx="4" fill="#27273a" stroke="#e50914" stroke-width="1.5" />
    <line x1="80" y1="24" x2="80" y2="105" stroke="#e2e8f0" stroke-width="4" />
    <!-- Impeller blades -->
    <line x1="55" y1="105" x2="105" y2="105" stroke="#ffffff" stroke-width="4" stroke-linecap="round" />
    <path d="M 60 100 Q 80 115 100 100" fill="none" stroke="#ffffff" stroke-width="2" />
    <!-- Indicators -->
    <text x="80" y="55" font-family="'Outfit', sans-serif" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">MIXING CHAMBER</text>
    <text x="80" y="118" font-family="'JetBrains Mono', monospace" font-size="10" fill="#f8fafc" text-anchor="middle">AGITATOR 120 RPM</text>
    
    <!-- Output Pipe -->
    <rect x="70" y="150" width="20" height="25" fill="#3f3f50" />
    <path d="M 80 150 L 80 175" stroke="#a855f7" stroke-width="6" />
  </g>

  <!-- Technical Overlay HUD / Ladder Logic Snippet -->
  <g transform="translate(30, 290)">
    <rect x="0" y="0" width="180" height="65" rx="6" fill="#101018" stroke="#252535" stroke-width="1" />
    <text x="12" y="20" font-family="'JetBrains Mono', monospace" font-size="10" fill="#a1a1aa">LADDER RUNG #04</text>
    <text x="12" y="38" font-family="'JetBrains Mono', monospace" font-size="11" fill="#4ade80">|--[ 0.01 ]--[/ 0.02 ]--( 100.01 )--|</text>
    <text x="12" y="53" font-family="'JetBrains Mono', monospace" font-size="9" fill="#71717a">TIMER TIM000 #150 (15.0s MIX)</text>
  </g>

  <g transform="translate(390, 290)">
    <rect x="0" y="0" width="185" height="65" rx="6" fill="#101018" stroke="#252535" stroke-width="1" />
    <text x="12" y="20" font-family="'JetBrains Mono', monospace" font-size="10" fill="#a1a1aa">I/O ADDRESS STATUS</text>
    <circle cx="18" cy="36" r="4" fill="#22c55e" />
    <text x="28" y="40" font-family="'JetBrains Mono', monospace" font-size="10" fill="#e4e4e7">IN 0.00: START PB</text>
    <circle cx="18" cy="52" r="4" fill="#ef4444" />
    <text x="28" y="55" font-family="'JetBrains Mono', monospace" font-size="10" fill="#e4e4e7">OUT 100.02: SOL-A ON</text>
  </g>
</svg>
