<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a0f" />
      <stop offset="100%" stop-color="#050508" />
    </linearGradient>
    <linearGradient id="panelGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1f2029" />
      <stop offset="100%" stop-color="#12131a" />
    </linearGradient>
    <pattern id="grid3" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="1" />
    </pattern>
  </defs>

  <rect width="600" height="380" rx="12" fill="url(#bgGrad3)" />
  <rect width="600" height="380" fill="url(#grid3)" rx="12" />

  <!-- Industrial Header Banner -->
  <rect x="25" y="20" width="550" height="35" rx="6" fill="#15151e" stroke="#252532" stroke-width="1" />
  <circle cx="45" cy="37" r="5" fill="#e50914" />
  <circle cx="62" cy="37" r="5" fill="#f59e0b" />
  <circle cx="79" cy="37" r="5" fill="#10b981" />
  <text x="105" y="42" font-family="'JetBrains Mono', monospace" font-size="12" fill="#a1a1aa" letter-spacing="1">BNSP CERTIFIED • LOW VOLTAGE CONTROL PANEL (MCC)</text>
  <rect x="460" y="27" width="100" height="20" rx="4" fill="rgba(229,9,20,0.15)" stroke="#e50914" stroke-width="1" />
  <text x="473" y="41" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="bold" fill="#ff4d4d">MEGGER: 550 MΩ</text>

  <!-- Control Cabinet Enclosure -->
  <g transform="translate(40, 75)">
    <!-- Outer Metal Cabinet -->
    <rect x="0" y="0" width="340" height="215" rx="8" fill="url(#panelGrad)" stroke="#3f3f50" stroke-width="2" />
    
    <!-- DIN Rail 1 (Top) -->
    <rect x="15" y="20" width="310" height="6" fill="#71717a" />
    <!-- Main 3-Phase MCCB -->
    <rect x="25" y="10" width="45" height="42" rx="3" fill="#18181b" stroke="#e50914" stroke-width="1.5" />
    <rect x="42" y="20" width="12" height="18" fill="#e50914" rx="2" />
    <text x="47" y="60" font-family="'JetBrains Mono', monospace" font-size="8" fill="#e4e4e7" text-anchor="middle">MCCB</text>
    
    <!-- MCB 1P x 4 -->
    <rect x="85" y="12" width="18" height="38" rx="2" fill="#27272a" stroke="#52525b" />
    <rect x="107" y="12" width="18" height="38" rx="2" fill="#27272a" stroke="#52525b" />
    <rect x="129" y="12" width="18" height="38" rx="2" fill="#27272a" stroke="#52525b" />
    <rect x="151" y="12" width="18" height="38" rx="2" fill="#27272a" stroke="#52525b" />

    <!-- 24VDC Industrial Power Supply (SMPS) -->
    <rect x="185" y="10" width="55" height="42" rx="3" fill="#09090b" stroke="#3b82f6" stroke-width="1.5" />
    <text x="212" y="32" font-family="'JetBrains Mono', monospace" font-size="8" fill="#60a5fa" text-anchor="middle">24V DC</text>
    <circle cx="230" cy="22" r="2.5" fill="#22c55e" />

    <!-- Omron Relays on DIN Rail -->
    <rect x="255" y="12" width="16" height="38" fill="#1e1e24" stroke="#a1a1aa" />
    <rect x="275" y="12" width="16" height="38" fill="#1e1e24" stroke="#a1a1aa" />
    <rect x="295" y="12" width="16" height="38" fill="#1e1e24" stroke="#a1a1aa" />

    <!-- DIN Rail 2 (Middle) -->
    <rect x="15" y="90" width="310" height="6" fill="#71717a" />
    <!-- Magnetic Contactor 1 + TOR -->
    <g transform="translate(30, 75)">
      <rect x="0" y="0" width="45" height="40" rx="3" fill="#1e293b" stroke="#e50914" />
      <text x="22" y="24" font-family="'JetBrains Mono', monospace" font-size="8" fill="#ffffff" text-anchor="middle">KM1</text>
      <!-- Overload relay attached below -->
      <rect x="5" y="42" width="35" height="25" rx="2" fill="#0f172a" stroke="#64748b" />
      <circle cx="22" cy="54" r="4" fill="#e50914" />
    </g>

    <!-- Magnetic Contactor 2 + TOR -->
    <g transform="translate(90, 75)">
      <rect x="0" y="0" width="45" height="40" rx="3" fill="#1e293b" stroke="#e50914" />
      <text x="22" y="24" font-family="'JetBrains Mono', monospace" font-size="8" fill="#ffffff" text-anchor="middle">KM2</text>
      <rect x="5" y="42" width="35" height="25" rx="2" fill="#0f172a" stroke="#64748b" />
      <circle cx="22" cy="54" r="4" fill="#e50914" />
    </g>

    <!-- Omron Solid State Relay / Timer H3CR -->
    <g transform="translate(150, 75)">
      <rect x="0" y="0" width="45" height="40" rx="3" fill="#18181b" stroke="#f59e0b" />
      <circle cx="22" cy="20" r="12" fill="#27272a" stroke="#f59e0b" stroke-width="1.5" />
      <line x1="22" y1="20" x2="29" y2="14" stroke="#ffffff" stroke-width="2" />
      <text x="22" y="55" font-family="'JetBrains Mono', monospace" font-size="8" fill="#a1a1aa" text-anchor="middle">TIMER</text>
    </g>

    <!-- Terminal Blocks (Bottom) -->
    <g transform="translate(15, 170)">
      <rect x="0" y="0" width="310" height="28" fill="#27272a" rx="3" />
      <line x1="30" y1="0" x2="30" y2="28" stroke="#3f3f46" stroke-width="2" />
      <line x1="60" y1="0" x2="60" y2="28" stroke="#3f3f46" stroke-width="2" />
      <line x1="90" y1="0" x2="90" y2="28" stroke="#3f3f46" stroke-width="2" />
      <line x1="120" y1="0" x2="120" y2="28" stroke="#3f3f46" stroke-width="2" />
      <line x1="150" y1="0" x2="150" y2="28" stroke="#3f3f46" stroke-width="2" />
      <text x="155" y="18" font-family="'JetBrains Mono', monospace" font-size="9" fill="#71717a" text-anchor="middle">FIELD TERMINAL BLOCKS (U, V, W, PE)</text>
    </g>
  </g>

  <!-- Digital Measuring Instruments on Right Side -->
  <g transform="translate(410, 75)">
    <!-- Insulation Tester (Megger) -->
    <rect x="0" y="0" width="160" height="100" rx="8" fill="#161622" stroke="#e50914" stroke-width="1.5" />
    <rect x="12" y="12" width="136" height="36" rx="4" fill="#09090d" stroke="#252535" />
    <text x="22" y="34" font-family="'JetBrains Mono', monospace" font-size="16" font-weight="bold" fill="#22c55e">550 MΩ</text>
    <text x="105" y="28" font-family="'JetBrains Mono', monospace" font-size="9" fill="#71717a">TEST V:</text>
    <text x="105" y="40" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="bold" fill="#e50914">500V DC</text>
    <text x="15" y="65" font-family="'JetBrains Mono', monospace" font-size="9" fill="#a1a1aa">INSULATION TESTER</text>
    <circle cx="20" cy="80" r="5" fill="#ef4444" />
    <circle cx="40" cy="80" r="5" fill="#000000" stroke="#71717a" />
    <text x="55" y="84" font-family="'JetBrains Mono', monospace" font-size="9" fill="#22c55e">PASSED (PUIL 2011)</text>

    <!-- Digital Multi-Power Meter -->
    <g transform="translate(0, 115)">
      <rect x="0" y="0" width="160" height="100" rx="8" fill="#161622" stroke="#38bdf8" stroke-width="1.5" />
      <rect x="12" y="12" width="136" height="45" rx="4" fill="#09090d" stroke="#252535" />
      <text x="20" y="30" font-family="'JetBrains Mono', monospace" font-size="11" fill="#38bdf8">V: 382.4 V (3φ)</text>
      <text x="20" y="47" font-family="'JetBrains Mono', monospace" font-size="11" fill="#f59e0b">I: 14.8 A | P: 8.2 kW</text>
      <text x="15" y="75" font-family="'JetBrains Mono', monospace" font-size="9" fill="#a1a1aa">DIGITAL WATTMETER</text>
      <text x="15" y="88" font-family="'JetBrains Mono', monospace" font-size="9" fill="#22c55e">COS φ: 0.94 (NORMAL)</text>
    </g>
  </g>

  <!-- Safety Banner Footer -->
  <g transform="translate(30, 310)">
    <rect x="0" y="0" width="540" height="50" rx="6" fill="#111118" stroke="#252535" stroke-width="1" />
    <text x="20" y="22" font-family="'JetBrains Mono', monospace" font-size="11" fill="#e4e4e7">DAIHATSU SAFETY DOJO PROTOCOL: <tspan fill="#22c55e">ZERO ACCIDENT STANDARD VERIFIED</tspan></text>
    <text x="20" y="38" font-family="'JetBrains Mono', monospace" font-size="10" fill="#71717a">WIRING TESTED VIA SIMURELAY &amp; PHYSICAL INSULATION CHECK • PUIL / K3 LISTRIK OK</text>
  </g>
</svg>
